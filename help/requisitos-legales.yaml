slug: requisitos-legales
title: Requisitos legales
routes:
    - legal_requirement_index
summary: >
    Aquí se recoge la legislación ambiental aplicable al centro y, de cada norma, las obligaciones
    concretas que nos toca cumplir. Periódicamente se evalúa si se están cumpliendo.
legal:
    - label: 'ISO 14001:2015 · apartado 6.1.3 (Requisitos legales y otros requisitos)'
      note: >
          La norma exige determinar y tener acceso a los requisitos legales y otros requisitos
          aplicables a los aspectos ambientales, y determinar cómo se aplican al centro.
      url: 'https://www.iso.org/standard/60857.html'
    - label: 'ISO 14001:2015 · apartado 9.1.2 (Evaluación del cumplimiento)'
      note: >
          Obliga además a evaluar periódicamente el cumplimiento de esos requisitos y a mantener el
          conocimiento de su estado.
      url: 'https://www.iso.org/standard/60857.html'
docs:
    - PC-06.03
    - RL-06.03
body: |
    <p>Este módulo es el que conecta el sistema con la ley. No basta con listar normas: hay que
    extraer de cada una qué obligación concreta implica para el centro y comprobar si se cumple.</p>

    <h2>Cómo funciona, paso a paso</h2>
    <ol>
        <li>Registra la <strong>legislación aplicable</strong> a la actividad del centro (residuos,
        vertidos, equipos, productos químicos, etc.).</li>
        <li>De cada norma, <strong>extrae la obligación concreta</strong> que nos aplica (no la ley
        entera: el requisito que debemos cumplir).</li>
        <li>Haz <strong>evaluación semestral del cumplimiento</strong> de cada requisito.</li>
    </ol>

    <h2>Consejo</h2>
    <p>Vincula cada requisito con el aspecto ambiental al que afecta. Así, cuando cambie una ley,
    sabrás enseguida a qué parte del sistema afecta.</p>
