slug: proveedor-evaluacion
title: Evaluación del proveedor
summary: >
    El resultado de valorar a un proveedor o contrata según criterios ambientales (cumplimiento,
    incidencias, certificaciones). De ahí sale su "estado" y la decisión de seguir contando con él.
legal:
    - label: 'ISO 14001:2015 · apartado 8.1 (Control de procesos contratados externamente)'
      note: >
          La norma exige controlar los procesos externalizados que afectan al desempeño ambiental;
          evaluar a los proveedores es la forma de verificar ese control.
      url: 'https://www.iso.org/standard/60857.html'
docs:
    - PC.05.0
    - F.12.0
body: |
    <p>Evaluar al proveedor es preguntarse <strong>si cumple ambientalmente</strong>: ¿gestiona bien sus
    residuos?, ¿usa productos adecuados?, ¿ha tenido incidencias?, ¿tiene certificación?</p>
    <p>El resultado marca el <strong>estado</strong> del proveedor (p. ej. aprobado, condicionado o
    rechazado). Un proveedor mal evaluado puede acabar generándote a ti una no conformidad, así que su
    estado orienta si conviene seguir trabajando con él o exigirle mejoras.</p>
